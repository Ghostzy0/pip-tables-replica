name: Replica source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y libegl1
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - run: python scripts/verify_core.py
      - run: python -m unittest discover -s tests -v
      - run: python launch.py --smoke /tmp/replica-smoke.json
